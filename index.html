<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>榕樹下菜單</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {

        }
        /* 自定義捲軸樣式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部固定區：標題列 + 已點摘要 + 分類篩選，捲動時永遠可見 -->
    <div class="sticky top-0 z-30">

                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight">榕樹下菜單</h1>
            </div>
        </header>

        <!-- 已點摘要：新增即直接顯示，不需點開 -->
        <div class="bg-white border-b border-slate-200 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 pt-2">
                <div class="flex items-center justify-between gap-3">
                    <span id="summaryHeader" class="flex items-center gap-1.5 text-sm font-semibold text-slate-700 shrink-0 transition-colors">
                        <i class="fa-solid fa-receipt text-orange-600"></i>
                        已點 <span id="summaryCount">0</span> 項
                    </span>
                    <button onclick="toggleCartModal()" class="text-xs text-slate-400 hover:text-orange-600 flex items-center gap-1 shrink-0">
                        購物車 <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- 已點品項清單：加入後立即顯示於此，數量可直接加減 -->
                <div id="summaryItemsList" class="max-h-40 overflow-y-auto text-sm text-slate-600 divide-y divide-slate-50 my-1.5">
                    <p class="text-slate-300 py-1 text-xs">尚未點選任何菜品</p>
                </div>

                <!-- 時價/另計提醒：一點到就立即顯示 -->
                <p id="summaryTimePriceNote" class="hidden text-xs text-amber-600 font-semibold mb-1">
                    <i class="fa-solid fa-circle-info"></i> 時價另計的品項未計入總價
                </p>

                <div class="flex items-center justify-between pb-2 text-sm font-bold">
                    <span id="summaryWarning" class="hidden text-xs font-bold text-red-600 shrink-0">
                        <i class="fa-solid fa-triangle-exclamation"></i> 已超過2,000
                    </span>
                    <span id="summaryGrandTotalWrap" class="ml-auto flex items-center gap-[2ch] text-orange-600 transition-colors">
                        <span>總計</span>
                        <span class="flex items-center font-mono tabular-nums">
                            <span class="mr-[2ch]">$</span><span id="summaryGrandTotal" class="inline-block min-w-[5ch] text-right">0</span>
                        </span>
                    </span>
                </div>

                <!-- 分類篩選（手機直接換行顯示，不橫向捲動） -->
                <div id="categoryFilters" class="flex flex-wrap gap-1.5 pb-3">
                    <!-- 動態載入分類按鈕 -->
                </div>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        <div class="flex justify-between items-center mb-4 gap-3 flex-wrap">
            <h2 id="currentCategoryTitle" class="text-xl font-bold text-slate-800">全部菜色</h2>
            <div class="flex items-center gap-2">
                <span id="itemCount" class="text-xs text-slate-500 bg-slate-200 px-2.5 py-1 rounded-full font-medium">共 0 項</span>
                <select id="sortSelect" class="bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="default">預設排序</option>
                    <option value="asc">價格由低到高 (時價除外)</option>
                    <option value="desc">價格由高到低</option>
                </select>
            </div>
        </div>

        <!-- 菜品列表網格 -->
        <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-2">
            <!-- 動態載入菜品卡片 -->
        </div>

        <!-- 無搜尋結果提示 -->
        <div id="noResult" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-100 mt-4">
            <i class="fa-solid fa-face-frown text-4xl text-slate-300 mb-2"></i>
            <p class="text-slate-500 text-sm">找不到符合條件的菜品</p>
        </div>
    </main>

            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">

                    <i class="fa-solid fa-cart-shopping text-orange-600"></i>
                    <h3 class="font-bold text-slate-800">您的點單清單</h3>
                </div>
                <button onclick="toggleCartModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="cartItemsList" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100">
                <!-- 購物車品項 -->
            </div>

            <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-500">確定金額品項數：<span id="calcCount" class="font-bold text-slate-800">0</span> 項</span>
                    <span class="text-slate-500">固定價總計：<span id="totalPrice" class="text-xl font-bold text-orange-600">$0</span></span>

                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> 包含「時價」或「另計」之品項將於現場確認價格。

                </div>
            </div>
        </div>
    </div>

                    class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-1.5 ${currentCategory === cat ? 'bg-orange-600 text-white shadow-md shadow-orange-600/20' : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-100'}">
                    <span>${cat}</span>
                    <span class="text-xs opacity-75">${fmt(cat === '全部' ? menuData.length : menuData.filter(i => i.category === cat).length)}</span>
                </button>
            `).join('');
        }

        const OVER_BUDGET_THRESHOLD = 2000;

        // 渲染畫面最上方的「已點摘要」列：加入後直接顯示，超過門檻金額轉紅色警示
        function renderOrderSummary() {
            const cartKeys = Object.keys(cart);
            let grandTotal = 0;
            let totalCount = 0;

            cartKeys.forEach(id => {
                const entry = cart[id];
                totalCount += entry.count;
                if (entry.item.price > 0) grandTotal += entry.item.price * entry.count;
            });

            document.getElementById('summaryCount').innerText = fmt(totalCount);
            document.getElementById('summaryGrandTotal').innerText = fmt(grandTotal);

            // 已點品項清單：直接列出，不需點開；數量可直接用 +/- 按鈕調整
            // 用固定欄寬的 grid 排版，讓「數量」欄無論金額欄內容長短都對齊在同一位置
            const listEl = document.getElementById('summaryItemsList');
            if (cartKeys.length === 0) {
                listEl.innerHTML = `<p class="text-slate-300 py-1 text-xs">尚未點選任何菜品</p>`;
            } else {
                listEl.innerHTML = cartKeys.map(id => {
                    const entry = cart[id];
                    // 金額：$ 與數字固定用等寬字元排版，數字永遠預留「千位數」欄位寬度並靠右對齊
                    const priceCell = entry.item.price > 0
                        ? `<span class="flex items-center font-mono tabular-nums font-semibold text-slate-700"><span class="mr-[2ch]">$</span><span class="inline-block min-w-[5ch] text-right">${fmt(entry.item.price * entry.count)}</span></span>`
                        : `<span class="text-xs text-slate-400 text-right whitespace-nowrap">時價/另計</span>`;

                    return `
                        <div class="grid grid-cols-[minmax(0,1fr)_7.5rem_6.5rem] items-center gap-[2ch] py-1.5">
                            <span class="min-w-0 truncate">${entry.item.name}</span>
                            <div class="flex items-center gap-1 text-xs text-slate-500">
                                <span class="hidden sm:inline">數量</span>
                                <button onclick="updateCartItemCount(${id}, -1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded flex items-center justify-center text-slate-600 font-bold">
                                    <i class="fa-solid fa-minus text-[10px]"></i>
                                </button>
                                <span class="w-5 text-center font-semibold text-slate-700">${entry.count}</span>
                                <button onclick="updateCartItemCount(${id}, 1)" class="w-6 h-6 bg-orange-500 hover:bg-orange-600 text-white rounded flex items-center justify-center font-bold">
                                    <i class="fa-solid fa-plus text-[10px]"></i>
                                </button>
                            </div>
                            <div class="flex items-center justify-end">
                                ${priceCell}
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // 時價/另計提醒：只要購物車有這類品項就立即顯示
            const hasTimePriceItem = cartKeys.some(id => cart[id].item.price === 0);
            document.getElementById('summaryTimePriceNote').classList.toggle('hidden', !hasTimePriceItem);

            // 超過兩千元：已點區文字變紅色並顯示警示
            const isOverBudget = grandTotal > OVER_BUDGET_THRESHOLD;
            const header = document.getElementById('summaryHeader');
            const totalWrap = document.getElementById('summaryGrandTotalWrap');
            const warning = document.getElementById('summaryWarning');

            header.classList.toggle('text-red-600', isOverBudget);
            header.classList.toggle('text-slate-700', !isOverBudget);
            totalWrap.classList.toggle('text-red-600', isOverBudget);
            totalWrap.classList.toggle('text-orange-600', !isOverBudget);
            warning.classList.toggle('hidden', !isOverBudget);
            warning.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 已超過${fmt(OVER_BUDGET_THRESHOLD)}`;
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.getElementById('currentCategoryTitle').innerText = cat === '全部' ? '全部菜色' : cat;
            renderCategories();
            renderMenu();
        }

        // 渲染菜品清單
        function renderMenu() {
            let filtered = menuData.filter(item => {
                const matchCat = currentCategory === '全部' || item.category === currentCategory;
                const matchSearch = item.name.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            // 排序
            if (sortOrder === 'asc') {
                filtered.sort((a, b) => (a.price === 0 ? 99999 : a.price) - (b.price === 0 ? 99999 : b.price));
            } else if (sortOrder === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            }

            const grid = document.getElementById('menuGrid');
            const noResult = document.getElementById('noResult');
            const itemCount = document.getElementById('itemCount');

            itemCount.innerText = `共 ${fmt(filtered.length)} 項`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResult.classList.remove('hidden');
                return;
            }

            noResult.classList.add('hidden');

            grid.innerHTML = filtered.map(item => {
                const priceText = item.price === 0 ? '時價 / 另計' : `$${fmt(item.price)}`;
                const inCartCount = cart[item.id] ? cart[item.id].count : 0;

                return `
                    <div class="bg-white rounded-xl px-3 py-2 border border-slate-100 shadow-sm hover:shadow-md transition flex items-center justify-between gap-2">
                        <h3 class="font-bold text-slate-900 text-sm truncate min-w-0">${item.name}</h3>
                        <div class="shrink-0 flex items-center gap-2">
                            <span class="text-sm font-bold text-orange-600">${priceText}</span>
                            <button onclick="addToCart(${item.id})" class="w-24 bg-orange-600 hover:bg-orange-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition flex items-center justify-center gap-1 whitespace-nowrap">
                                <i class="fa-solid fa-plus"></i> 加點 ${inCartCount > 0 ? `(${inCartCount})` : ''}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 購物車功能
        function addToCart(id) {
            const item = menuData.find(i => i.id === id);
            if (!cart[id]) {
                cart[id] = { item: item, count: 1 };
            } else {
                cart[id].count++;
            }
            renderOrderSummary();
            showToast(`已將「${item.name}」加入購物車`);
            renderMenu();
        }

        function updateCartItemCount(id, delta) {
            if (cart[id]) {
                cart[id].count += delta;
                if (cart[id].count <= 0) {
                    delete cart[id];
                }
            }
            renderOrderSummary();
            renderCartModalList();
            renderMenu();
        }


        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                renderCartModalList();
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderCartModalList() {
            const listContainer = document.getElementById('cartItemsList');
            const cartKeys = Object.keys(cart);
            let totalPrice = 0;
            let totalCount = 0;

            if (cartKeys.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-16 text-slate-400">
                        <i class="fa-solid fa-cart-arrow-down text-4xl mb-2"></i>
                        <p class="text-sm">購物車目前是空的</p>
                    </div>
                `;
                document.getElementById('totalPrice').innerText = '$0';
                document.getElementById('calcCount').innerText = '0';
                return;
            }

            listContainer.innerHTML = cartKeys.map(id => {
                const entry = cart[id];
                const subtotal = entry.item.price * entry.count;
                if (entry.item.price > 0) {
                    totalPrice += subtotal;
                }
                totalCount += entry.count;

                return `
                    <div class="py-3 flex justify-between items-center gap-3">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm text-slate-800">${entry.item.name}</h4>
                            <p class="text-xs text-slate-500">${entry.item.price === 0 ? '時價 / 另計' : `$${fmt(entry.item.price)} / 份`}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateCartItemCount(${id}, -1)" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center justify-center text-slate-600 text-xs transition">
                                <i class="fa-solid fa-minus"></i>
                            </button>
                            <span class="text-sm font-bold w-6 text-center">${entry.count}</span>
                            <button onclick="updateCartItemCount(${id}, 1)" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center justify-center text-slate-600 text-xs transition">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('totalPrice').innerText = `$${fmt(totalPrice)}`;
            document.getElementById('calcCount').innerText = fmt(totalCount);
        }

        function clearCart() {
            cart = {};
            renderOrderSummary();
            renderCartModalList();
            renderMenu();
            showToast('購物車已清空');
        }

        function checkout() {
            if (Object.keys(cart).length === 0) {
                showToast('購物車是空的，無法送出！');
                return;
            }
            alert('感謝您的點單！訂單已成功送出，請至櫃台或等待店員確認。');
            clearCart();
            toggleCartModal();
        }

        // 提示訊息 Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
