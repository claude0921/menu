<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特色餐廳互動菜單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
        }
        /* 自定義捲軸樣式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2.5 rounded-2xl backdrop-blur-sm">
                    <i class="fa-solid fa-utensils text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">美味食堂 互動菜單</h1>
                    <p class="text-xs text-orange-100">點擊菜品加入購物車，輕鬆完成點餐！</p>
                </div>
            </div>
            
            <!-- 搜尋與購物車按鈕區 -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-72">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="搜尋菜品名稱..." 
                        class="w-full pl-10 pr-4 py-2 bg-white/10 backdrop-blur-md border border-white/20 rounded-xl text-white placeholder-orange-200 focus:outline-none focus:ring-2 focus:ring-white/50 text-sm">
                </div>
                <button onclick="toggleCartModal()" class="relative bg-white text-orange-600 px-4 py-2 rounded-xl font-semibold text-sm shadow hover:bg-orange-50 transition flex items-center gap-2 shrink-0">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>購物車</span>
                    <span id="cartBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- 左側或頂部分類與排序控制 -->
        <div class="lg:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">菜色分類</h2>
                <div id="categoryFilters" class="flex flex-wrap lg:flex-col gap-1.5">
                    <!-- 動態載入分類按鈕 -->
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">價格排序</h2>
                <select id="sortSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="default">預設排序</option>
                    <option value="asc">價格由低到高 (時價除外)</option>
                    <option value="desc">價格由高到低</option>
                </select>
            </div>
        </div>

        <!-- 右側菜品展示網格 -->
        <div class="lg:col-span-3">
            <div class="flex justify-between items-center mb-4">
                <h2 id="currentCategoryTitle" class="text-xl font-bold text-slate-800">全部菜色</h2>
                <span id="itemCount" class="text-xs text-slate-500 bg-slate-200 px-2.5 py-1 rounded-full font-medium">共 0 項</span>
            </div>

            <!-- 菜品列表網格 -->
            <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                <!-- 動態載入菜品卡片 -->
            </div>

            <!-- 無搜尋結果提示 -->
            <div id="noResult" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-100 mt-4">
                <i class="fa-solid fa-face-frown text-4xl text-slate-300 mb-2"></i>
                <p class="text-slate-500 text-sm">找不到符合條件的菜品</p>
            </div>
        </div>
    </main>

    <div id="cartModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex justify-end hidden transition-opacity">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl transform transition-transform">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-orange-600"></i>
                    <h3 class="font-bold text-slate-800">您的點單清單</h3>
                </div>
                <button onclick="toggleCartModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-xl transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="cartItemsList" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100">
                <!-- 購物車品項 -->
            </div>

            <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-500">確定金額品項數：<span id="calcCount" class="font-bold text-slate-800">0</span> 項</span>
                    <span class="text-slate-500">固定價總計：<span id="totalPrice" class="text-xl font-bold text-orange-600">$0</span></span>
                </div>
                <p class="text-xs text-amber-600 bg-amber-50 p-2 rounded-lg border border-amber-200">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> 包含「時價」或「另計」之品項將於現場確認價格。
                </p>
                <div class="flex gap-2">
                    <button onclick="clearCart()" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2.5 rounded-xl font-semibold text-sm transition">
                        清空清單
                    </button>
                    <button onclick="checkout()" class="flex-1 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white py-2.5 rounded-xl font-semibold text-sm shadow-md transition">
                        送出訂單
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm">

            // 外食 (價格另計/時價)
            { id: 126, name: "必勝客", category: "外食", price: 0, desc: "代購披薩（價格另計）" },
            { id: 127, name: "麥當勞", category: "外食", price: 0, desc: "代購速食（價格另計）" },
            { id: 128, name: "胖老爹", category: "外食", price: 0, desc: "代購炸雞（價格另計）" },
            { id: 129, name: "桶子雞", category: "外食", price: 0, desc: "皮脆肉嫩桶子雞（價格另計）" },
            { id: 130, name: "碗糕", category: "外食", price: 0, desc: "古早味碗粿（價格另計）" },
            { id: 131, name: "燒餅油條", category: "外食", price: 0, desc: "傳統早點組合（價格另計）" },
            { id: 132, name: "飯丸", category: "外食", price: 0, desc: "傳統飯糰（價格另計）" },
            { id: 133, name: "肉包", category: "外食", price: 0, desc: "多汁鮮肉包（價格另計）" },
            { id: 134, name: "卦包", category: "外食", price: 0, desc: "割包夾控肉（價格另計）" },
            { id: 135, name: "煙燻料理", category: "外食", price: 0, desc: "特色煙燻美食（價格另計）" },
            { id: 136, name: "水果 (時價)", category: "外食", price: 0, desc: "季節新鮮水果（時價）" },

            // 生活用品與雜項
            { id: 137, name: "生活用品內衣 (35/UQ/涼感)", category: "生活用品", price: 35, desc: "各式內衣（35元起/UQ/涼感系列）" },
            { id: 138, name: "內褲 (天皇/紅螞蟻/UQ)", category: "生活用品", price: 100, desc: "品牌內褲（天皇/紅螞蟻/UQ）" },
            { id: 139, name: "雅閒香皂", category: "生活用品", price: 200, desc: "精選雅閒香皂" }
        ];

        let currentCategory = '全部';
        let searchQuery = '';
        let sortOrder = 'default';
        let cart = {}; // key: item id, value: { item, count }
        let clickCounts = {}; // key: item id, value: count

        // 初始化應用
        window.onload = function() {
            renderCategories();
            renderMenu();
            setupEventListeners();
        };

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.trim().toLowerCase();
                renderMenu();
            });

            document.getElementById('sortSelect').addEventListener('change', (e) => {
                sortOrder = e.target.value;
                renderMenu();
            });
        }

        // 渲染分類按鈕
        function renderCategories() {
            const categories = ['全部', '蛋', '青菜', '炸物', '雞肉', '豬肉', '牛肉', '小炒', '海鮮', '魚', '乾貨/雜糧', '另類', '外食', '生活用品'];
            const container = document.getElementById('categoryFilters');
            
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                    class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium transition text-left flex justify-between items-center ${currentCategory === cat ? 'bg-orange-600 text-white shadow-md shadow-orange-600/20' : 'bg-slate-50 text-slate-600 hover:bg-slate-100 border border-slate-100'}">
                    <span>${cat}</span>
                    <span class="text-xs opacity-75 hidden lg:inline">${cat === '全部' ? menuData.length : menuData.filter(i => i.category === cat).length}</span>
                </button>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.getElementById('currentCategoryTitle').innerText = cat === '全部' ? '全部菜色' : cat;
            renderCategories();
            renderMenu();
        }

        // 渲染菜品清單
        function renderMenu() {
            let filtered = menuData.filter(item => {
                const matchCat = currentCategory === '全部' || item.category === currentCategory;
                const matchSearch = item.name.toLowerCase().includes(searchQuery) || item.desc.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            // 排序
            if (sortOrder === 'asc') {
                filtered.sort((a, b) => (a.price === 0 ? 99999 : a.price) - (b.price === 0 ? 99999 : b.price));
            } else if (sortOrder === 'desc') {
                filtered.sort((a, b) => b.price - a.price);
            }

            const grid = document.getElementById('menuGrid');
            const noResult = document.getElementById('noResult');
            const itemCount = document.getElementById('itemCount');

            itemCount.innerText = `共 ${filtered.length} 項`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResult.classList.remove('hidden');
                return;
            }

            noResult.classList.add('hidden');

            grid.innerHTML = filtered.map(item => {
                const priceText = item.price === 0 ? '時價 / 另計' : `$${item.price}`;
                const clicks = clickCounts[item.id] || 0;
                const inCartCount = cart[item.id] ? cart[item.id].count : 0;

                return `
                    <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between group">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-2">
                                <span class="text-xs px-2.5 py-0.5 rounded-full bg-orange-50 text-orange-600 font-semibold border border-orange-100">${item.category}</span>
                                <span class="text-base font-bold text-slate-800">${priceText}</span>
                            </div>
                            <h3 class="font-bold text-slate-900 text-base mb-1 group-hover:text-orange-600 transition">${item.name}</h3>
                            <p class="text-xs text-slate-500 mb-4 line-clamp-2">${item.desc}</p>
                        </div>
                        
                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                            <div class="text-xs text-slate-400 flex items-center gap-1">
                                <i class="fa-solid fa-eye"></i> 點閱: <span class="font-medium text-slate-600">${clicks}</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <button onclick="handleItemClick(${item.id})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1">
                                    <i class="fa-solid fa-circle-info"></i> 詳細
                                </button>
                                <button onclick="addToCart(${item.id})" class="bg-orange-600 hover:bg-orange-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-semibold shadow transition flex items-center gap-1">
                                    <i class="fa-solid fa-plus"></i> 加點 ${inCartCount > 0 ? `(${inCartCount})` : ''}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 點擊菜品互動
        function handleItemClick(id) {
            if (!clickCounts[id]) clickCounts[id] = 0;
            clickCounts[id]++;
            const item = menuData.find(i => i.id === id);
            showToast(`您查看了：${item.name} (${clickCounts[id]}次)`);
            renderMenu();
        }

        // 購物車功能
        function addToCart(id) {
            const item = menuData.find(i => i.id === id);
            if (!cart[id]) {
                cart[id] = { item: item, count: 1 };
            } else {
                cart[id].count++;
            }
            updateCartBadge();
            showToast(`已將「${item.name}」加入購物車`);
            renderMenu();
        }

        function updateCartItemCount(id, delta) {
            if (cart[id]) {
                cart[id].count += delta;
                if (cart[id].count <= 0) {
                    delete cart[id];
                }
            }
            updateCartBadge();
            renderCartModalList();
            renderMenu();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            let totalCount = 0;
            for (let id in cart) {
                totalCount += cart[id].count;
            }
            if (totalCount > 0) {
                badge.innerText = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                renderCartModalList();
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderCartModalList() {
            const listContainer = document.getElementById('cartItemsList');
            const cartKeys = Object.keys(cart);
            let totalPrice = 0;
            let totalCount = 0;

            if (cartKeys.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-16 text-slate-400">
                        <i class="fa-solid fa-cart-arrow-down text-4xl mb-2"></i>
                        <p class="text-sm">購物車目前是空的</p>
                    </div>
                `;
                document.getElementById('totalPrice').innerText = '$0';
                document.getElementById('calcCount').innerText = '0';
                return;
            }

            listContainer.innerHTML = cartKeys.map(id => {
                const entry = cart[id];
                const subtotal = entry.item.price * entry.count;
                if (entry.item.price > 0) {
                    totalPrice += subtotal;
                }
                totalCount += entry.count;

                return `
                    <div class="py-3 flex justify-between items-center gap-3">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm text-slate-800">${entry.item.name}</h4>
                            <p class="text-xs text-slate-500">${entry.item.price === 0 ? '時價 / 另計' : `$${entry.item.price} / 份`}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateCartItemCount(${id}, -1)" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center justify-center text-slate-600 text-xs transition">
                                <i class="fa-solid fa-minus"></i>
                            </button>
                            <span class="text-sm font-bold w-6 text-center">${entry.count}</span>
                            <button onclick="updateCartItemCount(${id}, 1)" class="w-7 h-7 bg-slate-100 hover:bg-slate-200 rounded-lg flex items-center justify-center text-slate-600 text-xs transition">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('totalPrice').innerText = `$${totalPrice}`;
            document.getElementById('calcCount').innerText = totalCount;
        }

        function clearCart() {
            cart = {};
            updateCartBadge();
            renderCartModalList();
            renderMenu();
            showToast('購物車已清空');
        }

        function checkout() {
            if (Object.keys(cart).length === 0) {
                showToast('購物車是空的，無法送出！');
                return;
            }
            alert('感謝您的點單！訂單已成功送出，請至櫃台或等待店員確認。');
            clearCart();
            toggleCartModal();
        }

        // 提示訊息 Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
